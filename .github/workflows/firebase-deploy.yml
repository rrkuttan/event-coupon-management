name: Deploy to Firebase Hosting

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least-privilege token; the deploy auths via the service-account secret.
permissions:
  contents: read
  checks: write
  pull-requests: write

concurrency:
  group: firebase-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Live deploy — only on push to main (and manual runs).
  deploy_live:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://sobha-eternia-onam-2026.web.app
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to live channel
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SOBHA_ETERNIA_ONAM_2026 }}
          projectId: sobha-eternia-onam-2026
          channelId: live

  # Ephemeral preview channel for every pull request.
  deploy_preview:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to preview channel
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SOBHA_ETERNIA_ONAM_2026 }}
          projectId: sobha-eternia-onam-2026
          expires: 7d
